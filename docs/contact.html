<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Camila Rojas Molina</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/x-icon" href="faviconmu.ico">
</head>
<body class="font-sans leading-normal text-gray-900 bg-white pt-24">
    <header class="fixed top-4 inset-x-0 z-50 flex justify-center">
        <nav class="w-fit rounded-full bg-gray-900/90 dark:bg-white/90 border border-white/10 dark:border-gray-200 text-white dark:text-black px-2 py-2 flex items-center gap-1 backdrop-blur">
            <a href="index.html" aria-label="Home" class="group flex items-center transition-colors duration-300 rounded-full px-3 py-2 hover:bg-white/10 dark:hover:bg-black/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3 10.5L12 3l9 7.5" />
                    <path d="M5 10v10h14V10" />
                </svg>
                <span class="ml-0 max-w-0 opacity-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity,margin] duration-500 ease-in-out group-hover:ml-2 group-hover:max-w-[8rem] group-hover:opacity-100 group-focus-within:ml-2 group-focus-within:max-w-[8rem] group-focus-within:opacity-100">Home</span>
            </a>

            <a href="about.html" aria-label="About" class="group flex items-center transition-colors duration-300 rounded-full px-3 py-2 hover:bg-white/10 dark:hover:bg-black/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M20 21a8 8 0 0 0-16 0" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                <span class="ml-0 max-w-0 opacity-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity,margin] duration-500 ease-in-out group-hover:ml-2 group-hover:max-w-[8rem] group-hover:opacity-100 group-focus-within:ml-2 group-focus-within:max-w-[8rem] group-focus-within:opacity-100">About</span>
            </a>

            <a href="projects.html" aria-label="Projects" class="group flex items-center transition-colors duration-300 rounded-full px-3 py-2 hover:bg-white/10 dark:hover:bg-black/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 6h16" />
                    <path d="M4 12h10" />
                    <path d="M4 18h16" />
                </svg>
                <span class="ml-0 max-w-0 opacity-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity,margin] duration-500 ease-in-out group-hover:ml-2 group-hover:max-w-[8rem] group-hover:opacity-100 group-focus-within:ml-2 group-focus-within:max-w-[8rem] group-focus-within:opacity-100">Projects</span>
            </a>

            <a href="contact.html" aria-label="Contact" class="group flex items-center transition-colors duration-300 rounded-full px-3 py-2 hover:bg-white/10 dark:hover:bg-black/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 6h16v12H4z" />
                    <path d="M4 7l8 6 8-6" />
                </svg>
                <span class="ml-0 max-w-0 opacity-0 overflow-hidden whitespace-nowrap transition-[max-width,opacity,margin] duration-500 ease-in-out group-hover:ml-2 group-hover:max-w-[8rem] group-hover:opacity-100 group-focus-within:ml-2 group-focus-within:max-w-[8rem] group-focus-within:opacity-100">Contact</span>
            </a>

            <div class="w-px h-6 bg-white/15 dark:bg-gray-200 mx-1" aria-hidden="true"></div>

            <button type="button" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false" class="group flex items-center transition-colors duration-300 rounded-full px-3 py-2 hover:bg-white/10 dark:hover:bg-black/5 focus:outline-none focus-visible:ring-2 focus-visible:ring-primary">
                <svg class="h-5 w-5 block dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79Z" />
                </svg>
                <svg class="h-5 w-5 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" />
                    <path d="M12 2v2" />
                    <path d="M12 20v2" />
                    <path d="M4.9 4.9l1.4 1.4" />
                    <path d="M17.7 17.7l1.4 1.4" />
                    <path d="M2 12h2" />
                    <path d="M20 12h2" />
                    <path d="M4.9 19.1l1.4-1.4" />
                    <path d="M17.7 6.3l1.4-1.4" />
                </svg>
            </button>
        </nav>
    </header>

    <main>
        <section class="py-16 px-8">
            <div class="max-w-6xl mx-auto">
                <h1 class="text-4xl md:text-5xl font-bold mb-12">Get In Touch</h1>
                
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12">
                    <div>
                        <h2 class="text-2xl font-semibold mb-6">Let's Connect</h2>
                        <p class="text-gray-600 mb-8"></p>

                        <div class="space-y-6 mb-8">
                            <div>
                                <h3 class="text-xl font-semibold text-primary mb-2">Email</h3>
                                <p><a href="mailto:" class="text-primary hover:underline"></a></p>
                            </div>
                            <div>
                                <h3 class="text-xl font-semibold text-primary mb-2">Location</h3>
                                <p class="text-gray-600"></p>
                            </div>
                        </div>

                        <div class="flex gap-6">
                            <a href="#" target="_blank" class="text-primary hover:text-secondary font-medium transition-colors">LinkedIn</a>
                            <a href="#" target="_blank" class="text-primary hover:text-secondary font-medium transition-colors">GitHub</a>
                        </div>
                    </div>

                    <div>
                        <h2 class="text-2xl font-semibold mb-6">Send a Message</h2>
                        <form class="space-y-6">
                            <div class="flex flex-col">
                                <label for="name" class="mb-2 font-medium">Name</label>
                                <input type="text" id="name" name="name" required class="px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:border-primary">
                            </div>
                            <div class="flex flex-col">
                                <label for="email" class="mb-2 font-medium">Email</label>
                                <input type="email" id="email" name="email" required class="px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:border-primary">
                            </div>
                            <div class="flex flex-col">
                                <label for="message" class="mb-2 font-medium">Message</label>
                                <textarea id="message" name="message" rows="5" required class="px-4 py-3 border border-gray-300 rounded-md focus:outline-none focus:border-primary"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-full">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-gray-50 text-center py-8 mt-16 text-gray-600">
        <p>&copy; 2026 Camila Rojas Molina</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
